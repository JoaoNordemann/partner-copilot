[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "partner-copilot"
version = "0.2.0"
description = "RAG copilot for delivery restaurant partners: review analysis and menu/ops suggestions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "filelock>=3.13",
    "chromadb>=1.5.9",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "transformers>=4.40",
    "accelerate>=0.30",
    # bitsandbytes has no macOS wheels; the 4-bit path needs a CUDA GPU (Colab/Kaggle/Linux)
    "bitsandbytes>=0.43; sys_platform != 'darwin'",
]

[project.scripts]
partner-copilot = "partner_copilot.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",   # TestClient do FastAPI
    "ruff>=0.5",
]
train = [            # Fine-tuning com QLoRA
    "peft>=0.11",
    "trl>=0.9",
    "datasets>=2.19",
    "evaluate>=0.4",
    "scikit-learn>=1.4",
]
demo = ["gradio>=6,<7", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks", "data", "work"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]   # acentos/aspas em pt-BR nos textos e docstrings

[tool.ruff.lint.isort]
known-first-party = ["partner_copilot"]

[tool.ruff.format]
quote-style = "double"

# -------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "semantic: sanidade com modelo multilingue real em cache local (opt-in)",
    "gpu: testes reais com CUDA e pesos em cache; opt-in --run-gpu e excluídos do CI",
]
[tool.setuptools.package-data]
"partner_copilot.generation" = ["templates/*.txt", "templates/*.json"]
