name: CPU tests and lint
on:
  push:
  pull_request:
jobs:
  retriever-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install unit-test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Run CPU unit tests without Chroma or models
        run: python -m pytest tests/test_retriever.py tests/test_retriever_dependencies.py tests/test_generation_prompt.py tests/test_generation_versions.py tests/test_generation_retrospective.py tests/test_results_tables.py tests/test_api.py tests/test_api_replay.py tests/test_api_dependencies.py tests/test_container.py tests/test_demo.py tests/test_run_mvp.py tests/test_generation_correction.py tests/test_structured_generation.py tests/test_final_v3.py tests/test_generation_provider.py tests/test_ask_cli.py tests/test_generation_journal.py tests/test_generation_evaluation.py -m "not gpu" -v
      - name: Install Chroma for aspect integration
        run: python -m pip install 'chromadb>=1.5.9'
      - name: Run aspect integration with a fake extractor
        run: python -m pytest tests/test_aspect_integration.py -v
      - name: Verify generated results and README
        run: python scripts/build_results.py --check --update-readme
      - name: Verify historical demo examples
        run: python scripts/build_demo_examples.py --check
      - name: Verify ABSA splits and template reservation
        env:
          PYTHONPATH: src
        run: python scripts/prepare_absa_splits.py --check
      - name: Verify versioned ABSA dataset and provenance
        env:
          PYTHONPATH: src
        run: python scripts/build_absa_dataset.py --check-static
